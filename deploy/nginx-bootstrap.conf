# Include inside the existing HTTP server that handles the game's bootstrap.
# This does not replace the server's other locations, HTTPS, or DNAS routing.
location = /gsinit.php {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.0;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
    proxy_buffering off;
}
