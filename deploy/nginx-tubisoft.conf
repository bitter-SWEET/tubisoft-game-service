# Optional separate HTTP vhost for a machine whose default vhost redirects
# websites to HTTPS. Install through the operator's normal nginx workflow.
server {
    listen 80;
    listen [::]:80;
    server_name gsconnect.ubisoft.com;
    server_tokens off;
    access_log off;
    client_header_timeout 10s;
    client_max_body_size 1k;

    location = /gsinit.php {
        keepalive_timeout 0;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.0;
        proxy_set_header Host $host;
        proxy_set_header Connection close;
        proxy_buffering off;
    }
    location / { return 404; }
}
